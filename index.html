<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Calculate subnets, CIDR ranges, and IP membership entirely in your browser."
    />
    <meta name="theme-color" content="#f7f7f7" />
    <meta name="google-site-verification" content="Z1DqMyrGPuaSpM_UDUaxcvTOlKBrdGj7fKbcZFca9_U" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <title>SpeedBench - Networking Calculator</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('speedbench-theme') || localStorage.getItem('netbench-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', t === 'dark' ? '#1a1a1a' : '#f7f7f7');
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" crossorigin href="/assets/style.css" />
  </head>
  <body class="bg-(--bg) font-sans text-(--ink) antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
